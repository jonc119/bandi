[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "delivery-qc"
version = "0.1.0"
description = "Deterministic shadow-mode delivery QC checker for Stratus packages and containers"
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["openpyxl>=3.1,<4"]

[project.scripts]
delivery-qc = "delivery_qc.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
